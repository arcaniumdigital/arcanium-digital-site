name: Platform CI

on:
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"
      - "package.json"
  push:
    branches: ["main"]
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"
      - "package.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/apps/platform-core/package-lock.json
      - run: npm ci
        working-directory: platform/apps/platform-core
      - run: npm run check
        working-directory: platform/apps/platform-core
      - run: npm test
        working-directory: platform/apps/platform-core
      - run: npm ci
        working-directory: platform/packages/contracts
      - run: npm run check
        working-directory: platform/packages/contracts
